name: "Build"
description: "Docker Build"

inputs:
  version:
    description: "Version"
    required: true
  stack-name:
    description: "Stack Name"
    required: true
  stack-file:
    description: "Stack File"
    required: false
    default: "docker-compose-swarm.yaml"
  config-file:
    description: "Config File"
    required: true
  portainer-url:
    description: "Registry Username"
    required: true
  portainer-token:
    description: "Registry Password"
    required: true
  registry:
    description: "Registry Hostname"
    required: false
    default: "ghcr.io"

runs:
  using: "composite"
  steps:
    - name: "Debug ${{ github.ref_name }}"
      shell: bash
      run: |
        echo inputs.version: '${{ inputs.version }}'
        echo inputs.stack-name: '${{ inputs.stack-name }}'
        echo inputs.stack-file: '${{ inputs.stack-file }}'
        echo inputs.config-file: '${{ inputs.config-file }}'
        echo inputs.version: '${{ inputs.version }}'
        echo inputs.portainer-url: '${{ inputs.portainer-url }}'
        echo inputs.portainer-token: '${{ inputs.portainer-token }}'
        echo inputs.registry: '${{ inputs.registry }}'

    - name: "Checkout Service Configs"
      uses: actions/checkout@v4
      with:
        repository: "hosted-domains/service-configs"
        ssh-key: ${{ secrets.SERVICE_CONFIGS_KEY }}
        ref: master
        path: service-configs
        sparse-checkout: |
          ${{ inputs.config-file }}
        sparse-checkout-cone-mode: false

    - name: "Update Environment"
      shell: bash
      run: |
        echo "VERSION=${{ inputs.version }}" | tee -a "service-configs/${{ inputs.config-file }}"
        echo "STACK_NAME=${{ inputs.stack-name }}" | tee -a "service-configs/${{ inputs.config-file }}"

    - name: "Portainer Deploy"
      uses: cssnr/portainer-stack-deploy-action@v1
      with:
        url: ${{ secrets.portainer-url }}
        token: ${{ secrets.portainer-token }}
        file: ${{ inputs.stack-file}}
        name: ${{ inputs.stack-name}}
        type: file
        env_file: "service-configs/${{ inputs.config-file }}"
