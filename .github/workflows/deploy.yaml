name: "Deploy"

on:
  workflow_call:
    inputs:
      GHCR_TAG:
        required: true
        type: string
      STACK_NAME:
        required: true
        type: string
      STACK_FILE:
        required: false
        type: string
        default: docker-compose-swarm.yaml
      CONFIG_FILE:
        required: true
        type: string
      CONFIG_PATH:
        required: false
        type: string
        default: service-configs
    secrets:
      SERVICE_CONFIGS_KEY:
        required: true
      PORTAINER_URL:
        required: true
      PORTAINER_TOKEN:
        required: true

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Find and Replace"
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "STACK_NAME"
          replace: ${{ inputs.STACK_NAME }}
          include: ${{ inputs.STACK_FILE}}
          regex: false

      - name: "Debug"
        run: |
          env
          cat ${{ inputs.STACK_FILE}}

      - name: "Checkout Service Configs"
        uses: actions/checkout@v4
        with:
          repository: "hosted-domains/service-configs"
          ssh-key: ${{ secrets.SERVICE_CONFIGS_KEY }}
          ref: master
          path: ${{ inputs.CONFIG_PATH }}
          sparse-checkout: |
            ${{ inputs.CONFIG_FILE }}
          sparse-checkout-cone-mode: false

      - name: "Update Environment"
        run: |
          echo "VERSION=${GHCR_TAG}" | tee -a "{{ inputs.CONFIG_PATH }}/${{ inputs.CONFIG_FILE }}"

      - name: "Parse Environment"
        id: parse
        uses: cssnr/env-json-action@master
        with:
          source: ${{ inputs.CONFIG_PATH }}/${{ inputs.CONFIG_FILE }}

      - name: "Portainer Deploy"
        uses: cssnr/portainer-stack-deploy-action@v1
        with:
          url: ${{ secrets.PORTAINER_URL }}
          token: ${{ secrets.PORTAINER_TOKEN }}
          file: ${{ inputs.STACK_FILE}}
          name: ${{ inputs.STACK_NAME}}
          type: file
          env_json: "${{ steps.parse.outputs.result }}"
