name: "Dev CI"

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Tag to Deploy"
        type: string
        required: true
        default: "dev"
      CLEANUP:
        description: "Run Cleanup"
        type: boolean
        required: true
        default: true
  push:
    branches-ignore:
      - master

jobs:
  build:
    name: "Build"
    uses: ./.github/workflows/build.yaml
    if: ${{ !contains(github.event.head_commit.message, '#noci') }}
    permissions:
      packages: write
    with:
      VERSION: ${{ inputs.VERSION != '' && inputs.VERSION || 'dev' }}
      GHCR_USER: ${{ vars.GHCR_USER }}
    secrets:
      GHCR_PASS: ${{ secrets.GHCR_PASS }}

  deploy:
    name: "Deploy"
    uses: ./.github/workflows/deploy.yaml
    needs: build
    with:
      VERSION: ${{ inputs.VERSION != '' && inputs.VERSION || 'dev' }}
      STACK_NAME: dev_cssnr-django5-boiler
      STACK_FILE: docker-compose-swarm.yaml
      CONFIG_FILE: services/shane/django5-boiler/dev.env
    secrets:
      SERVICE_CONFIGS_KEY: ${{ secrets.SERVICE_CONFIGS_KEY }}
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}

  cleanup:
    name: "Cleanup"
    uses: ./.github/workflows/cleanup.yaml
    needs: deploy
    if: ${{ inputs.CLEANUP != '' && inputs.CLEANUP || true }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
