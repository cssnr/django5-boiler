name: "Lint"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - ".assets/**"
      - ".github/disabled/**"
      - "nginx/nginx.conf"
      - "**/requirements*"
      - ".dockerignore"
      - ".gitignore"
      - "Makefile"
      - "pyproject.toml"
      - "*.env*"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.head_commit.message, '#nolint') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      #- name: "Debug event.json"
      #  if: ${{ always() }}
      #  run: |
      #    cat "${GITHUB_EVENT_PATH}"

      - name: "Debug"
        run: |
          echo "github.workflow: ${{ github.workflow }}"
          echo "pull_request.number: ${{ github.event.pull_request.number }}"
          echo "${{ github.workflow }}-${{ github.event.pull_request.number }}"

      - name: "Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install"
        id: install
        run: |
          python -m pip install -U pip
          python -m pip install -Ur app/requirements.txt

      - name: "Flake8"
        if: ${{ always() && !cancelled() }}
        run: |
          flake8 --max-line-length 119 --extend-exclude "venv,node_modules,migrations"

      - name: "Ruff"
        if: ${{ always() && !cancelled() }}
        uses: astral-sh/ruff-action@v3

      - name: "Black"
        if: ${{ always() && !cancelled() }}
        uses: psf/black@stable

      - name: "Isort"
        if: ${{ always() && !cancelled() }}
        uses: isort/isort-action@v1

      - name: "Mypy"
        if: ${{ always() && !cancelled() }}
        run: |
          mypy .

      - name: "Bandit"
        if: ${{ always() && !cancelled() }}
        run: |
          bandit .

      - name: "Prettier"
        if: ${{ always() && !cancelled() }}
        run: |
          npm install prettier
          npx prettier --check .

      - name: "Bandit"
        if: ${{ always() && !cancelled() }}
        run: |
          bandit src

      #- name: "Hadolint"
      #  if: ${{ always() && !cancelled() }}
      #  uses: hadolint/hadolint-action@v3.1.0
      #  with:
      #    dockerfile: Dockerfile
      #    recursive: true

      - name: "yamllint"
        if: ${{ always() && !cancelled() }}
        run: |
          echo "::group::List Files"
          yamllint -d '{extends: relaxed, ignore: [node_modules/]}' --list-files .
          echo "::endgroup::"
          yamllint -d '{extends: relaxed, ignore: [node_modules/]}' .

      - name: "Actionlint"
        if: ${{ always() && !cancelled() }}
        run: |
          echo "::group::Download Actionlint"
          tag=$(curl -sI https://github.com/rhysd/actionlint/releases/latest | grep -i '^location:' | sed -E 's|.*/tag/v?(.*)|\1|' | tr -d '\t\r\n')
          echo "tag: ${tag}"
          url="https://github.com/rhysd/actionlint/releases/latest/download/actionlint_${tag}_linux_amd64.tar.gz"
          echo "url: ${url}"
          curl -sL "${url}" | tar xz -C "${RUNNER_TEMP}" actionlint
          file "${RUNNER_TEMP}/actionlint"
          echo "::endgroup::"
          "${RUNNER_TEMP}/actionlint" --version
          "${RUNNER_TEMP}/actionlint" -color -verbose -shellcheck= -pyflakes=

      #- name: "SonarQube"
      #  uses: SonarSource/sonarqube-scan-action@v4
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
