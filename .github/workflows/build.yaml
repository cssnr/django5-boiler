name: "Build"

on:
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string
      GHCR_URI:
        required: true
        type: string
      GHCR_USER:
        required: true
        type: string
    secrets:
      GHCR_PASS:
        required: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Set Cache Directory"
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: "Node Cache"
        uses: actions/cache@v4
        id: npm-cache
        # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: "Node Cache Hit"
        if: ${{ steps.npm-cache.outputs.cache-hit }}
        run: |
          echo "dir: '${{ steps.npm-cache-dir.outputs.dir }}'"
          echo "cache-hit: '${{ steps.npm-cache.outputs.cache-hit }}'"

      - name: "Install Node"
        run: |
          npm install

      - name: "Update SW Cache Version"
        env:
          SERVICE_WORKER: app/static/js/sw.js
        run: |
          echo "Updating SW Cache to: v${GITHUB_RUN_NUMBER}"
          sed -i "0,/v1/s//v${GITHUB_RUN_NUMBER}/" ${SERVICE_WORKER}
          head ${SERVICE_WORKER} -n 4

      #- name: "Debug"
      #  run: |
      #    pwd
      #    ls
      #    ls -lAh app/static
      #    head app/static/js/sw.js -n 4

      - name: "Docker Login"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.GHCR_USER }}
          password: ${{ secrets.GHCR_PASS }}

      - name: "Setup Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: "Bake and Push"
        uses: docker/bake-action@v6
        env:
          VERSION: "required-for-variable-interpolation"
          STACK_NAME: "required-for-variable-interpolation"
          TRAEFIK_HOST: "required-for-variable-interpolation"
        with:
          source: "."
          files: docker-compose-swarm.yaml
          push: true
          targets: app,nginx
          set: |
            app.tags=${{ inputs.GHCR_URI }}-app:${{ inputs.VERSION }}
            nginx.tags=${{ inputs.GHCR_URI }}-nginx:${{ inputs.VERSION }}
            *.platform=linux/amd64,linux/arm64
            *.output=type=image,push=true
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      #- name: "Trigger Deploy"
      #  uses: benc-uk/workflow-dispatch@v1
      #  with:
      #    workflow: deploy.yaml
