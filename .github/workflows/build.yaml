name: "Build"

on:
  workflow_call:
    inputs:
      GHCR_TAG:
        required: true
        type: string
      GHCR_URI:
        required: true
        type: string
      GHCR_USER:
        required: true
        type: string
    secrets:
      GHCR_PASS:
        required: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install Dependencies"
        run: |
          npm install

      - name: "Update Cache Version"
        env:
          SERVICE_WORKER: app/static/js/sw.js
        run: |
          echo "Updating Cache to Version: v${GITHUB_RUN_NUMBER}"
          sed -i "0,/v1/s//v${GITHUB_RUN_NUMBER}/" ${SERVICE_WORKER}
          head ${SERVICE_WORKER} -n 4

      - name: "Docker Login"
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ inputs.GHCR_USER }}
          password: ${{ secrets.GHCR_PASS }}

      - name: "Setup Buildx"
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: "Bake and Push"
        uses: docker/bake-action@v5
        with:
          files: docker-bake.json
          push: true
          set: |
            *.app.tags=${{ inputs.GHCR_URI }}/app:${{ inputs.GHCR_TAG }}
            *.nginx.tags=${{ inputs.GHCR_URI }}/nginx:${{ inputs.GHCR_TAG }}

      #- name: "Trigger Deploy"
      #  uses: benc-uk/workflow-dispatch@v1
      #  with:
      #    workflow: deploy.yaml
